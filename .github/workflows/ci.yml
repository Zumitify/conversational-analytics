name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest
      - name: Offline eval suites
        run: |
          python -m eval.run --suite basics --orders 8000
          python -m eval.run --suite comparisons --orders 8000
          python -m eval.run --suite followups --orders 8000
